        <g transform="matrix(2.585937,0,0,2.585937,148,-1545.907468)">
          <!-- Apple's macOS icon grid: 824/1024 body with a 185.4 corner radius
               (22.5%). The tile is 128 units here, so rx = 128 * 0.225 = 28.8 —
               rounder than the in-app tile, so it sits native in the Dock. -->
          <rect x="0" y="624.496" width="128" height="128" rx="28.8" style="fill:rgb(13,13,13);"/>
        </g>
