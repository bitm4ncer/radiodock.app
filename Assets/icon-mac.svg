<?xml version="1.0" encoding="UTF-8"?>
<!-- macOS app icon: the RadioDock tile inset with margin. macOS does NOT round
     app icons automatically — the file must carry the rounded shape + margin.
     Reuses the exact paths from public/icons/icon.svg (rounded tile + logo),
     scaled to ~824px and centered in a 1024 canvas (Apple's icon grid). -->
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
