name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

# Build each platform in parallel, then publish ONE clean "latest stable"
# release. The release carries no changelog and is not per-build versioned —
# users only ever see a single current release with the three installers.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder --win
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: desktop/dist/RadioDock-win.exe
          retention-days: 1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder --mac
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: desktop/dist/RadioDock-mac.dmg
          retention-days: 1

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Flatpak toolchain + the Freedesktop runtime/SDK and the Electron base app
      # the bundled Electron links against inside the sandbox.
      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//23.08 \
            org.freedesktop.Sdk//23.08 \
            org.electronjs.Electron2.BaseApp//23.08
      - run: npm ci
        working-directory: desktop
      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish=never
        env:
          USE_SYSTEM_FPM: 1
        working-directory: desktop
      # Flatpak is newer/experimental here; if it fails, the AppImage and the rest
      # of the release still ship. The release job only attaches it when it exists.
      - name: Build Flatpak (non-blocking)
        continue-on-error: true
        run: npx electron-builder --linux flatpak --publish=never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            desktop/dist/RadioDock-linux.AppImage
            desktop/dist/RadioDock-linux.flatpak
          if-no-files-found: warn
          retention-days: 1

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # One stable release, tag `latest`, clean generic notes. Update in place so
      # `/releases/latest/download/…` (used by the site's install buttons) never
      # 404s. --clobber replaces the previous installers with the fresh build.
      - name: Publish latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          NOTES="The latest stable version of RadioDock for desktop. Download the installer for your platform below."
          FILES="installers/RadioDock-win.exe installers/RadioDock-mac.dmg installers/RadioDock-linux.AppImage"
          [ -f installers/RadioDock-linux.flatpak ] && FILES="$FILES installers/RadioDock-linux.flatpak"
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit latest --repo "$REPO" --title "RadioDock" --notes "$NOTES" --latest
            gh release upload latest --repo "$REPO" --clobber $FILES
          else
            gh release create latest --repo "$REPO" --target "$GITHUB_SHA" \
              --title "RadioDock" --notes "$NOTES" --latest $FILES
          fi
          # Now that the fresh `latest` is published, delete every other release +
          # tag so old builds never pile up — there is only ever one release.
          for tag in $(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "latest" ]; then
              echo "Removing old release: $tag"
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
            fi
          done
