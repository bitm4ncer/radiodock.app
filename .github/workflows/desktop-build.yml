name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: RadioDock-linux.AppImage
          - os: macos-latest
            artifact: RadioDock-mac.dmg
          - os: windows-latest
            artifact: RadioDock-win.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Electron app
        working-directory: desktop
        run: npx electron-builder --${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'mac' || 'win' }}

      - name: Find artifact
        id: find
        shell: bash
        working-directory: desktop
        run: |
          FILE=$(find dist -name "${{ matrix.artifact }}" -o -name "RadioDock-win.exe" | head -1)
          echo "path=$FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename "$FILE")" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: "Desktop App — Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: desktop/${{ steps.find.outputs.path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
